  <rect x="244" y="156" width="24" height="32" rx="4" class="bg" />
  <rect x="284" y="156" width="24" height="32" rx="4" class="bg" />
  <rect x="244" y="212" width="24" height="32" rx="4" class="bg" />
  <rect x="284" y="212" width="24" height="32" rx="4" class="bg" />
  
  <!-- Negative Space Windows on Left Tower -->
  <rect x="158" y="204" width="24" height="28" rx="4" class="bg" />
  <rect x="158" y="252" width="24" height="28" rx="4" class="bg" />
  
  <!-- Rent / Lease / Checkmark integration across the base -->
